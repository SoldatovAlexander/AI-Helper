services:
  ai-helper:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-helper:local
    ports:
      - "127.0.0.1:${AI_HELPER_PORT:-8000}:8000"
    env_file:
      - .env
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
