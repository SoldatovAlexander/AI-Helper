name: Docker smoke checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run offline tests
        run: python -m pytest -q

      - name: Build image
        run: docker build --tag ai-helper:ci .

      - name: Start container
        run: docker run --detach --name ai-helper-smoke --publish 127.0.0.1:8000:8000 ai-helper:ci

      - name: Check API health over HTTP
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              echo "AI-Helper health endpoint is responding"
              exit 0
            fi
            sleep 1
          done
          docker logs ai-helper-smoke
          exit 1

      - name: Stop container
        if: always()
        run: docker rm --force ai-helper-smoke || true
