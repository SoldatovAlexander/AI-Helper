name: Docker smoke checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run offline tests
        run: python -m pytest -q

      - name: Run linter
        run: python -m ruff check app tests

      - name: Prepare environment and validate Compose
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build and start with Docker Compose
        run: docker compose up --build --detach

      - name: Check API health over HTTP
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              echo "AI-Helper health endpoint is responding"
              exit 0
            fi
            sleep 1
          done
          docker compose logs ai-helper
          exit 1

      - name: Stop container
        if: always()
        run: docker compose down --remove-orphans || true
